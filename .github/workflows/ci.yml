name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check types
        run: uv run --no-sync mypy
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Check links
        run: uv run --no-sync python tools/check_links.py
      - name: Check translations
        run: uv run --no-sync python tools/check_translations.py
      - name: Build and smoke-test wheel
        run: uv run --no-sync python tools/check_wheel.py
      - name: Upload reproducibility bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asrai-repro-python-${{ matrix.python-version }}
          path: dist/repro/
          if-no-files-found: error
