[project]
name = "asrai"
version = "0.1.0"
description = "First-pass art direction for game assets: deterministic measurement, qualified observation, precedent retrieval and previewable recipes, as a CLI and an MCP server."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "pillow>=12,<13",
    "numpy>=2,<3",
]

[project.scripts]
asrai = "asrai.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asrai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The corpus validators are repo scripts, not package modules; importing them keeps
# `uv run pytest` the single command that checks code and shipped data together.
pythonpath = ["tools"]
addopts = "-q --strict-markers --strict-config"
