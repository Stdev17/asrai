[project]
name = "asrai"
version = "0.1.0"
description = "First-pass art direction for game assets: deterministic measurement, qualified observation, precedent retrieval and previewable recipes, as a CLI and an MCP server."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "pillow>=12,<13",
    "numpy>=2,<3",
]

[project.scripts]
asrai = "asrai.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.18", "types-jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asrai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The corpus validators are repo scripts, not package modules; importing them keeps
# `uv run pytest` the single command that checks code and shipped data together.
pythonpath = ["tools"]
addopts = "-q --strict-markers --strict-config"

[tool.mypy]
# The rule this enforces: a value that can be absent is guarded before it is used. It is checked
# rather than written out at each access, because a guard repeated at every site is one rule with
# many definitions, and the one that goes missing is the one nobody notices.
mypy_path = ["src", "tools"]
files = ["src/asrai", "tools"]
explicit_package_bases = true
# Beyond the defaults: an unreachable statement is a guard that cannot fire, which is the opposite
# failure to the one this check is here for and just as quiet. It found two validators annotated as
# if their input were already valid, one of them a guard `append` depends on at runtime.
warn_unreachable = true
strict_equality = true
warn_redundant_casts = true
# `warn_return_any` is left off. Eleven of its twelve hits are loaders returning what `json.loads`
# gave them, and the fix at each is a cast asserting something the stock manifest and validate_stock
# already hold. A check whose remedy is an unverified assertion buys nothing here.
# `tests/` is out on purpose: the suite feeds wrong types deliberately -- `records.append(7, log)`
# is a test that the boundary rejects an int -- so a checker there would object to the thing the
# test exists to prove.
